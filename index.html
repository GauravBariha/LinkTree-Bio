    html, body {
    /* width: 100%; */
    margin: 0;
    padding: 0;
    overflow: hidden; 
    height: 100%;
    
    background-size: cover;
    background-position: center;
    z-index: 0;
    }

    h2 {
    padding: 3px; 
    text-align: center;  
    font-size: 30px;
    font-family: Pacifico;
    color: white;
    font-size: 40px;
    }

    header {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    }

    header > img {
    
    border-radius: 50%;
    width: 200px;
    height: 200px;
    border: 2px solid #fff;
    }

    ul {
    display: flex;
    text-align: center;
    align-items: center;
    flex-direction: column;
    list-style: none;
    margin-top: 5em;
    padding: 0;
    

    }

    li {
    text-align: center;
    font-size: 35px;
    padding: 10px;
    padding-left: 20px;
    border: 2px solid black;
    border-radius: 40px;
    margin: 20px;
    box-sizing: border-box;
    width: 400px;   
    font-family: Cabin;
    box-shadow: rgb(28, 32, 93 / 24%)0px 2px 8px 0px;
    background-color: #fffa;

    
    }

    a {
    text-decoration: none;
    }

    svg {
    width: 30px;
    height: 30px;
    }

    #vanta {
    z-index: -1;
    position: absolute;
    left: 0;
    right: 0;
    width: 100%;
    height: 100%;
    top: 0;
    bottom: 0;
    }


    </style>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            VANTA.BIRDS({
                el: "#vanta",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00
            })
})

    </script>
